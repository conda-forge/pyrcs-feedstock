schema_version: 1

context:
  version: "1.3.0"
  python_min: "3.12"

package:
  name: pyrcs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyrcs/pyrcs-${{ version }}.tar.gz
  sha256: 2e0034fcb124fc92fb356420be7e46eade3a6b89fb010d1e78aff799862aaec7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pyhelpers >=2.5.3,<2.6.dev0
    - beautifulsoup4
    - curl-cffi

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - pyrcs
      pip_check: true

about:
  summary: An open-source tool for collecting railway codes used in different UK rail industry systems.
  description: |
    PyRCS is an open-source Python package that simplifies the collection and management of railway codes used across different systems in the UK rail industry. It provides a practical toolkit for researchers, practitioners and frequent users of the Railway Codes website who work extensively with railway codes in the UK. PyRCS enables efficient access, retrieval and manipulation of railway code data, enhancing productivity and effectiveness in working with these codes.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/mikeqfu/pyrcs
  repository: https://github.com/mikeqfu/pyrcs
  documentation: https://pyrcs.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - mikeqfu
